version: '3.8'

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.0
    entrypoint: /usr/local/bin/etcd
    command:
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    ports:
      - "2379:2379"
      - "2380:2380"

  issuance_service:
    build:
      context: .
      dockerfile: IssuanceService/Dockerfile
    ports:
      - "8000:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - AUTHORITY_SEED=71b1dfdcfcb42076f1bf505ee104807c5c7230edcc695666b88a41677b587b3f

  gateway_service:
    build:
      context: .
      dockerfile: GatewayService/Dockerfile
    ports:
      - "8001:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - KEYLESS_HOST=http://host.docker.internal:8089
      - AUTHORITY_SEED=71b1dfdcfcb42076f1bf505ee104807c5c7230edcc695666b88a41677b587b3f
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - subscription_service

  subscription_service:
    build:
      context: .
      dockerfile: SubscriptionService/Dockerfile
    ports:
      - "5000:5000"
      # Note: gRPC default often uses HTTP/2 on 5000/5001.
      # ASPNETCORE_URLS can optimize this.
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - KEYLESS_HOST=http://host.docker.internal:8089
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - etcd

  internal_service:
    build:
      context: .
      dockerfile: InternalService/Dockerfile
    ports:
      - "8002:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - KEYLESS_HOST=http://host.docker.internal:8089
    extra_hosts:
      - "host.docker.internal:host-gateway"