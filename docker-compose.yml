services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.0
    command: etcd --advertise-client-urls http://0.0.0.0:2379 --listen-client-urls http://0.0.0.0:2379
    ports:
      - "2379:2379"
    volumes:
      - etcd-data:/etcd-data

  issuance-service:
    build: .
    command: uvicorn issuance_service.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  subscription-service:
    build: .
    command: python subscription_service/main.py
    ports:
      - "50051:50051"
    environment:
      - ETCD_HOST=etcd
      - ETCD_PORT=2379
    depends_on:
      - etcd

  gateway-service:
    build: .
    command: uvicorn gateway_service.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - ISSUANCE_SERVICE_URL=http://issuance-service:8000
      - SUBSCRIPTION_SERVICE_HOST=subscription-service
      - SUBSCRIPTION_SERVICE_PORT=50051
      - INTERNAL_SERVICE_URL=http://internal-service:8002
    depends_on:
      - issuance-service
      - subscription-service

  internal-service:
    build: .
    command: uvicorn internal_service.main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - GATEWAY_SERVICE_URL=http://gateway-service:8001
    depends_on:
      - gateway-service

volumes:
  etcd-data:
